[package]
name = "VoxelPopuli"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true

[dependencies]
flate2 = "1.1.9"
glam = "0.33"
glfw = "0.62.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.10"
rayon = "1.11.0"
wgpu = "30.0.0"
