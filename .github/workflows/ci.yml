name: C/C++ Static Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck flawfinder libgl1-mesa-dev libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev
        git clone https://github.com/raysan5/raylib.git /tmp/raylib
        cd /tmp/raylib && git checkout 5.0 && sudo make install && cd -

    - name: Run cppcheck
      run: cppcheck --enable=all --error-exitcode=1 src/

    - name: Run flawfinder
      run: flawfinder --error-level=4 src/

    - name: Build
      run: make
