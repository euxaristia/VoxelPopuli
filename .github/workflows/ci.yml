name: C/C++ Static Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck flawfinder libgl1-mesa-dev libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev

    - name: Run cppcheck
      run: cppcheck --error-exitcode=1 --force -I src/ src/main.c src/chunk.c src/world.c src/noise.c

    - name: Run flawfinder
      run: flawfinder --error-level=1 src/main.c src/chunk.c src/world.c src/noise.c

    - name: Build
      run: make
